name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Browser checks
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Microsoft Edge for Playwright
        run: npx playwright install --with-deps msedge
      - run: npm run build
      - name: Start the app
        run: |
          mkdir -p .local
          # Throwaway key for this run's local test server only.
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          # Raised limits for the local test server only (ignored in production).
          export TEST_RATE_LIMIT_SCALE=50
          nohup npm run preview > .local/preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/api/health && exit 0
            sleep 2
          done
          cat .local/preview.log
          exit 1
      - name: Create the synthetic account
        run: node scripts/browser-check.mjs
      - name: Run every browser check
        run: node scripts/verify-browser.mjs
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            .local/*.log
            .local/*.png
            docs/evidence/*.png
          retention-days: 14
          include-hidden-files: true
